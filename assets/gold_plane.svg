<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3e2c1c;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#8b7355;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3e2c1c;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7e6c56;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0" />
        </radialGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Main Body -->
    <path d="M256 40 L210 120 L210 380 L256 460 L302 380 L302 120 Z" fill="url(#bronze-grad)" filter="url(#shadow)" />
    <path d="M256 60 L230 130 L230 360 L256 420 L282 360 L282 130 Z" fill="url(#gold-grad)" opacity="0.6" />

    <!-- Wings -->
    <path d="M210 200 L40 320 L40 400 L210 350 Z" fill="#2d1f15" />
    <path d="M302 200 L472 320 L472 400 L302 350 Z" fill="#2d1f15" />
    
    <path d="M210 210 L60 310 L60 380 L210 340 Z" fill="url(#bronze-grad)" />
    <path d="M302 210 L452 310 L452 380 L302 340 Z" fill="url(#bronze-grad)" />

    <!-- Cannons -->
    <rect x="70" y="280" width="15" height="100" rx="4" fill="#1a1a1a" />
    <rect x="100" y="300" width="15" height="100" rx="4" fill="#1a1a1a" />
    <rect x="427" y="280" width="15" height="100" rx="4" fill="#1a1a1a" />
    <rect x="397" y="300" width="15" height="100" rx="4" fill="#1a1a1a" />
    
    <rect x="72" y="280" width="11" height="30" rx="2" fill="#5e4b2e" />
    <rect x="102" y="300" width="11" height="30" rx="2" fill="#5e4b2e" />
    <rect x="429" y="280" width="11" height="30" rx="2" fill="#5e4b2e" />
    <rect x="399" y="300" width="11" height="30" rx="2" fill="#5e4b2e" />

    <!-- Central Core Glow -->
    <circle cx="256" cy="250" r="30" fill="url(#glow-grad)" opacity="0.8">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="256" cy="250" r="10" fill="#fff" opacity="0.9" />

    <!-- Thrusters -->
    <path d="M220 440 L240 480 L272 480 L292 440 Z" fill="#1a1a1a" />
    <rect x="235" y="450" width="10" height="20" fill="#ff4400" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.1s" repeatCount="indefinite" />
    </rect>
    <rect x="267" y="450" width="10" height="20" fill="#ff4400" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.12s" repeatCount="indefinite" />
    </rect>

    <!-- Cockpit -->
    <ellipse cx="256" cy="130" rx="15" ry="30" fill="#101020" />
    <ellipse cx="256" cy="120" rx="8" ry="15" fill="#303050" opacity="0.5" />
</svg>
