name: Export Web + Deploy to Cloudflare Pages

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO USE
# ─────────────────────────────────────────────────────────────────────────────
# This workflow supports TWO deployment modes depending on how your repo is
# configured. Pick one and ignore the other.
#
# ── MODE A: GitHub Actions builds Godot + deploys (fully automated) ──────────
#   Requires:
#     - CLOUDFLARE_API_TOKEN  (repo secret)
#     - CLOUDFLARE_ACCOUNT_ID (repo secret)
#   CF Pages dashboard:
#     - Disconnect Git integration / disable auto-deployments
#     - Build command: (blank)   Output dir: web
#
# ── MODE B: Commit the web/ build + let CF Pages serve it (no secrets) ───────
#   Steps:
#     1. Build in Godot: Export → Web → web/index.html
#     2. git add web/ && git commit && git push
#     3. CF Pages dashboard: Build command blank, Output dir: web
#     4. CF deploys automatically on push — no GitHub Actions needed
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-and-deploy:
    # Only runs when CLOUDFLARE_API_TOKEN secret is configured (MODE A).
    # If the secret is absent the job is skipped — CF Pages serves committed
    # web/ files instead (MODE B).
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable || true

      - name: Export Web build
        run: |
          mkdir -p web
          godot --headless --export-release "Web" web/index.html
          echo "Build complete:"
          ls -lh web/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: red-one-plus
          directory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
